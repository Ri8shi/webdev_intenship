<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole | ArcadeX</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="../../index.html" class="logo-text" style="text-decoration: none; color: inherit;">Arcade<span class="highlight">X</span></a>
        </div>
        <nav><a href="../../index.html" class="back-btn">← Back</a></nav>
    </header>

    <main class="game-container">
        <div class="game-header">
            <h1 class="whack-title">Whack-a-Mole</h1>
            <div class="scores" style="display:flex;gap:2rem;">
                <div class="score-box">Score: <span id="score">0</span></div>
                <div class="score-box" style="color:#ef4444;">Time left: <span id="time-left">30</span></div>
            </div>
        </div>
        
        <div class="game-board-container">
            <div class="grid">
                <div class="hole" id="1"></div>
                <div class="hole" id="2"></div>
                <div class="hole" id="3"></div>
                <div class="hole" id="4"></div>
                <div class="hole" id="5"></div>
                <div class="hole" id="6"></div>
                <div class="hole" id="7"></div>
                <div class="hole" id="8"></div>
                <div class="hole" id="9"></div>
            </div>
            
            <div id="start-screen" class="overlay">
                <button id="start-btn" class="action-btn">Start Game</button>
            </div>
            <div id="game-over-screen" class="overlay hidden">
                <h2 class="game-over-text">Time's Up!</h2>
                <button id="restart-btn" class="action-btn">Play Again</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
