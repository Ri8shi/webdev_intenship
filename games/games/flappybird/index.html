<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird | ArcadeX</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="../../index.html" class="logo-text" style="text-decoration: none; color: inherit;">Arcade<span class="highlight">X</span></a>
        </div>
        <nav><a href="../../index.html" class="back-btn">← Back</a></nav>
    </header>

    <main class="game-container">
        <div class="game-header">
            <h1 class="flappy-title">Flappy Bird</h1>
            <div class="scores"><div class="score-box">Score: <span id="score">0</span></div></div>
        </div>
        <div class="game-board-container">
            <canvas id="gameCanvas" width="320" height="480"></canvas>
            <div id="start-screen" class="overlay">
                <button id="start-btn" class="action-btn">Start Game</button>
                <p style="margin-top:1rem;color:#fff;">Space or Click to flap</p>
            </div>
            <div id="game-over-screen" class="overlay hidden">
                <h2 class="game-over-text">Game Over</h2>
                <button id="restart-btn" class="action-btn">Play Again</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
