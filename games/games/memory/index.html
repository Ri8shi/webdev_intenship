<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match | ArcadeX</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background orbs -->
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2" style="background: var(--accent-1);"></div>

    <header>
        <div class="logo-container">
            <a href="../../index.html" class="logo-text" style="text-decoration: none; color: inherit;">Arcade<span class="highlight">X</span></a>
        </div>
        <nav>
            <a href="../../index.html" class="back-btn">← Back to Hub</a>
        </nav>
    </header>

    <main class="game-container">
        <div class="game-header">
            <h1 class="memory-title">Memory Match</h1>
            <div class="scores">
                <div class="score-box">Moves: <span id="moves">0</span></div>
                <div class="score-box">Matches: <span id="matches">0</span> / 8</div>
            </div>
        </div>

        <div class="game-board-container">
            <div id="memory-grid" class="memory-grid">
                <!-- Cards injected by JS -->
            </div>
            
            <div id="game-over-screen" class="overlay hidden">
                <h2 class="game-over-text">You Win!</h2>
                <p style="margin-bottom: 1.5rem; font-size: 1.2rem;">Moves taken: <span id="final-moves"></span></p>
                <button id="restart-btn" class="action-btn">Play Again</button>
            </div>
            <div id="start-screen" class="overlay">
                <button id="start-btn" class="action-btn">Start Game</button>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
