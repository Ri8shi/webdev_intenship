<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors | ArcadeX</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="../../index.html" class="logo-text" style="text-decoration: none; color: inherit;">Arcade<span class="highlight">X</span></a>
        </div>
        <nav><a href="../../index.html" class="back-btn">← Back</a></nav>
    </header>

    <main class="game-container">
        <div class="game-header">
            <h1 class="rps-title">Rock Paper Scissors</h1>
            <p style="color:var(--text-muted); margin-bottom:1rem;">First to 10 points wins!</p>
        </div>
        
        <div class="game-board-container">
            <div class="scoreboard">
                <div class="score-card">Player<br><span id="player-score" style="font-size: 2rem;">0</span></div>
                <div class="score-card">Computer<br><span id="comp-score" style="font-size: 2rem;">0</span></div>
            </div>

            <div class="arena">
                <div class="choice-display" id="player-display">❓</div>
                <div class="vs">VS</div>
                <div class="choice-display" id="comp-display">❓</div>
            </div>

            <div id="result-message" class="result">Let's Play!</div>

            <div id="game-over-screen" class="overlay hidden">
                <h2 class="game-over-text" id="winner-text" style="font-family:var(--font-display); color:#06b6d4; font-size:3rem; margin-bottom:1rem; text-align:center;"></h2>
                <button id="restart-btn" class="action-btn">Play Again</button>
            </div>

            <div class="choices">
                <button class="choice-btn" id="rock">✊</button>
                <button class="choice-btn" id="paper">✋</button>
                <button class="choice-btn" id="scissors">✌️</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
