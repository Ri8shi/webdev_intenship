<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe | ArcadeX</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2" style="background: var(--accent-2);"></div>

    <header>
        <div class="logo-container">
            <a href="../../index.html" class="logo-text" style="text-decoration: none; color: inherit;">Arcade<span class="highlight">X</span></a>
        </div>
        <nav>
            <a href="../../index.html" class="back-btn">← Back to Hub</a>
        </nav>
    </header>

    <main class="game-container">
        <div class="game-header">
            <h1 class="tictactoe-title">Tic-Tac-Toe</h1>
            <div class="mode-selector" style="margin-bottom: 1.5rem; display:flex; justify-content:center; gap:1rem;">
                <button id="mode-pvp" class="action-btn" style="padding:0.5rem 1rem; font-size:1rem; border-radius:12px; box-shadow:none; background:linear-gradient(135deg, #f43f5e, #e11d48);">2 Player</button>
                <button id="mode-pvc" class="action-btn" style="padding:0.5rem 1rem; font-size:1rem; border-radius:12px; box-shadow:none; filter: grayscale(100%); opacity:0.6;">vs CPU</button>
            </div>
            <div id="status-display" class="status">Player X's Turn</div>
        </div>

        <div class="game-board-container">
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </div>

        <button id="restart-btn" class="action-btn" style="margin-top: 2rem;">Restart Game</button>
    </main>
    <script src="script.js"></script>
</body>
</html>
